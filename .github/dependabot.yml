version: 2

# One npm entry per directory with its own package-lock.json. When adding a
# new package, add a matching entry here — the CI audit loop in
# .github/workflows/security.yml discovers lockfiles automatically, but
# Dependabot requires an explicit entry per directory (sl-qpbx).
#
# The ten tooling/* packages deliberately have no entries of their own: they are
# npm workspaces behind the root lockfile (ADR-049), so the root entry below
# covers all of them and a shared-dependency bump arrives as one PR rather than
# one per package. A new package under tooling/ needs no entry here.
updates:
  # Root package (devDependencies: eslint, typescript, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]

  # Project website
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]

  # Python lint tools (ruff, yamllint) pinned in requirements-dev.txt.
  # Pinned so a new ruff release can't change the enforced rule set outside
  # a reviewable PR (sl-5kvp); rule selection itself lives in ruff.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
