name: Deploy Site

on:
  # release.yml dispatches this workflow directly after every release,
  # because GitHub never raises 'release: published' for a release created
  # with GITHUB_TOKEN (anti-recursion protection) — every release in this
  # repo is created that way, so an 'on: release' trigger here would never
  # fire (rv-tmb4).
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Resolve version from VERSION file (falls back to git tag)
        id: version
        run: |
          if [ -f VERSION ]; then
            TAG="v$(cat VERSION | tr -d '[:space:]')"
          else
            TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo 'v0.0.0')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $TAG"

      - name: Write version data for Eleventy
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "{\"version\":\"$TAG\",\"version_tag\":\"$TAG\"}" > site/_data/site.json

      - name: Copy test stats for Eleventy
        run: cp test-stats.json site/_data/stats.json

      - name: Copy diary entries and generate manifest
        run: |
          mkdir -p site/satsuma-diaries/content
          cp -rf satsuma-diaries/. site/satsuma-diaries/
          python3 scripts/generate-diary-manifest.py

      # ── "Try it Live!" playground (feature 33) ──────────────────────────
      # The playground is a server-free static bundle built from the viz
      # harness. It is copied into site/playground/ BEFORE the Eleventy
      # build, which passes it through as-is (see site/.eleventy.js), so it
      # publishes at <pages-url>/playground/. Every asset in the bundle is
      # page-relative, so the non-root base path needs no extra config.
      # tree-sitter build --wasm downloads a ~119MB wasi-sdk toolchain into
      # ~/.cache/tree-sitter on every invocation unless it's already present.
      # Keyed on the root lockfile that pins tree-sitter-cli (which hardcodes the
      # wasi-sdk version it fetches), so a version bump there — and only that —
      # invalidates the cache (sl-wz2h). Restored before the install below, which
      # is what triggers the download now that `ci:all` also builds the grammar.
      - name: Cache wasi-sdk toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/tree-sitter
          key: wasi-sdk-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Installs the workspace and builds every package in dependency order,
      # including the WASM grammar the playground loads as its in-browser parser
      # (feature 42, R2).
      - name: Install and build tooling packages (playground build)
        run: npm run ci:all

      - name: Build the playground bundle and copy it into the site
        run: |
          npm --prefix tooling/satsuma-viz-harness run build:playground
          mkdir -p site/playground
          cp -rf tooling/satsuma-viz-harness/dist/playground/. site/playground/

      - name: Install site dependencies
        run: cd site && npm ci

      - name: Build site with Eleventy
        run: cd site && npx @11ty/eleventy

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/_site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
