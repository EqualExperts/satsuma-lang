name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create (e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  security:
    name: Security gate
    uses: ./.github/workflows/security.yml
    with:
      # Gate only. The push-triggered run of Security already publishes this
      # commit's SARIF; uploading again from here would register a second code
      # scanning configuration that exists on main but never on a PR, which
      # makes the "Semgrep OSS" PR check skip instead of gate (sl-1wtv).
      skip_sarif_upload: true
    permissions:
      contents: read
      security-events: write

  artifacts:
    needs: [security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate tagged-release metadata
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: node scripts/release-metadata.mjs validate "$RELEASE_TAG"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      # tree-sitter build --wasm downloads a ~119MB wasi-sdk toolchain into
      # ~/.cache/tree-sitter on every invocation unless it's already present.
      # Keyed on the root lockfile that pins tree-sitter-cli (which hardcodes the
      # wasi-sdk version it fetches), so a version bump there — and only that —
      # invalidates the cache (sl-wz2h). Restored before the install below, which
      # is what triggers the download now that `ci:all` also builds the grammar.
      - name: Cache wasi-sdk toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/tree-sitter
          key: wasi-sdk-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Installs the workspace and builds every package in dependency order,
      # including the WASM grammar the artifacts below bundle (feature 42, R2).
      - name: Install and build all workspace packages
        run: npm run ci:all

      - name: Build distributable artifacts
        run: ./scripts/build-artifacts.sh

      - name: Smoke-test global install
        shell: bash
        run: |
          # Install from the just-built tarball and confirm the CLI is functional.
          npm install -g ./tooling/satsuma-cli/satsuma-cli.tgz
          satsuma --version

          # Install the LSP tarball and drive a real initialize round-trip over
          # stdio. The server loads its WASM assets inside onInitialize, so this
          # catches a tarball that installs cleanly but cannot start (sl-vwpr).
          npm install -g ./tooling/satsuma-lsp/satsuma-lsp.tgz
          node tooling/satsuma-lsp/scripts/smoke-initialize.js "$(command -v satsuma-lsp)" --stdio

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: satsuma-cli
          path: tooling/satsuma-cli/satsuma-cli.tgz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-satsuma-vsix
          path: tooling/vscode-satsuma/vscode-satsuma.vsix

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: satsuma-lsp
          path: tooling/satsuma-lsp/satsuma-lsp.tgz

  release:
    needs: [artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed to dispatch deploy-site.yml below. GitHub never raises a
      # 'release: published' event for a release created by GITHUB_TOKEN
      # (anti-recursion protection), so deploy-site.yml's own 'on: release'
      # trigger never fires and the dispatch below is the only thing that
      # deploys the site after a release (rv-tmb4).
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true

      - name: Extract release notes from changelog
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: node scripts/release-metadata.mjs notes "$RELEASE_TAG" > release-notes.md

      - name: Rename release assets for tagged release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          cp -f satsuma-cli.tgz "satsuma-cli-${RELEASE_TAG}.tgz"
          cp -f satsuma-lsp.tgz "satsuma-lsp-${RELEASE_TAG}.tgz"
          cp -f vscode-satsuma.vsix "vscode-satsuma-${RELEASE_TAG}.vsix"

      - name: Create tagged release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            "satsuma-cli-${RELEASE_TAG}.tgz" \
            "satsuma-lsp-${RELEASE_TAG}.tgz" \
            "vscode-satsuma-${RELEASE_TAG}.vsix"

      - name: Update latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Delete existing latest release and tag if present
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          cat > notes.md <<'EOF'
          Auto-built from the latest `main` branch.

          **Install CLI:**
          ```bash
          npm install -g https://github.com/${{ github.repository }}/releases/download/latest/satsuma-cli-latest.tgz
          ```

          **Install LSP:**
          ```bash
          npm install -g https://github.com/${{ github.repository }}/releases/download/latest/satsuma-lsp-latest.tgz
          ```

          **Install VS Code Extension:**
          Download `vscode-satsuma-latest.vsix`, then in VS Code open the Extensions view,
          choose **Install from VSIX…** from the `···` menu (or run
          **Extensions: Install from VSIX…** from the Command Palette), and select the
          downloaded file. Or from the command line:
          ```bash
          code --install-extension vscode-satsuma-latest.vsix
          ```
          EOF

          cp -f satsuma-cli.tgz satsuma-cli-latest.tgz
          cp -f satsuma-lsp.tgz satsuma-lsp-latest.tgz
          cp -f vscode-satsuma.vsix vscode-satsuma-latest.vsix

          gh release create latest \
            --title "Latest build" \
            --notes-file notes.md \
            --prerelease \
            satsuma-cli-latest.tgz \
            satsuma-lsp-latest.tgz \
            vscode-satsuma-latest.vsix

      # deploy-site.yml's 'release: published' trigger never fires for a
      # release this job just created (see the 'actions: write' comment
      # above), so we dispatch it directly instead of relying on that event.
      # Runs unconditionally: exactly one of the two release-creation steps
      # above executes per trigger, and the site should redeploy after either.
      - name: Deploy the site for this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-site.yml --ref "${{ github.ref_name }}"
