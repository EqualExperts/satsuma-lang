name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # Allow release.yml to invoke this as a gate
    inputs:
      skip_sarif_upload:
        # GitHub derives a code scanning "configuration" from the CALLING
        # workflow file plus the job id, so a run invoked from release.yml
        # publishes its SARIF as `.github/workflows/release.yml:semgrep` — a
        # second configuration that only ever exists on main. Pull requests run
        # this workflow directly, so that configuration has no counterpart on
        # the PR and code scanning gives up on diffing: the "Semgrep OSS" check
        # reports "1 configuration not found" and skips instead of gating.
        # Callers must therefore opt out of the upload; the push-triggered run
        # of this same workflow already publishes the results for that commit.
        # See sl-1wtv.
        description: "Run the scan as a gate only, without publishing SARIF to code scanning"
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Parse allowlist
        id: allowlist
        run: |
          python3 scripts/parse-security-allowlist.py npm-audit > /tmp/npm-allowlist.txt
          echo "ids=$(cat /tmp/npm-allowlist.txt)" >> "$GITHUB_OUTPUT"

      - name: Audit all packages
        # npm audit reads package-lock.json directly (no install needed), so the
        # loop discovers every tracked lockfile instead of maintaining a
        # hardcoded directory list — new packages are covered automatically
        # without anyone remembering to edit this workflow (sl-qpbx).
        run: |
          set +e
          failed=0
          for lockfile in $(git ls-files '*package-lock.json'); do
            dir=$(dirname "$lockfile")
            echo "::group::npm audit — $dir"
            cd "$GITHUB_WORKSPACE/$dir"
            npm audit --omit=dev --audit-level=high 2>&1
            status=$?
            if [ $status -ne 0 ]; then
              echo "::warning::Audit issues found in $dir"
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ $failed -ne 0 ]; then
            echo "::error::npm audit found high/critical vulnerabilities. Add to .security-allowlist.yml if acknowledged."
            exit 1
          fi

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse allowlist
        id: allowlist
        run: |
          python3 scripts/parse-security-allowlist.py semgrep > /tmp/semgrep-allowlist.txt
          echo "ids=$(cat /tmp/semgrep-allowlist.txt)" >> "$GITHUB_OUTPUT"

      - name: Run Semgrep
        shell: bash
        run: |
          EXCLUDE_ARGS=""
          ALLOWLISTED="${{ steps.allowlist.outputs.ids }}"
          if [ -n "$ALLOWLISTED" ]; then
            IFS=',' read -ra RULES <<< "$ALLOWLISTED"
            for rule in "${RULES[@]}"; do
              if [ -n "$rule" ]; then
                EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude-rule $rule"
              fi
            done
          fi

          semgrep scan \
            --config auto \
            --error \
            --severity ERROR \
            --severity WARNING \
            $EXCLUDE_ARGS

      # Publishing to code scanning is skipped for callers that only want the
      # gate (see the `skip_sarif_upload` input) — re-scanning to produce a
      # SARIF nobody consumes just doubles the job's runtime.
      # `inputs` is empty for push and pull_request events, so the negation is
      # true there and both steps run as normal.
      - name: Generate SARIF
        if: always() && !inputs.skip_sarif_upload
        shell: bash
        run: |
          semgrep scan \
            --config auto \
            --severity ERROR \
            --severity WARNING \
            --sarif --sarif-output semgrep-results.sarif || true

      # No explicit `category` here: the default, `.github/workflows/security.yml:semgrep`,
      # is the configuration the repo's existing code scanning alert history is
      # filed under. Changing it would orphan those alerts.
      - name: Upload SARIF
        if: always() && !inputs.skip_sarif_upload
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: semgrep-results.sarif
        continue-on-error: true # Only works if GitHub Advanced Security is enabled
