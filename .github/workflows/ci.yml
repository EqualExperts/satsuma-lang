name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          # The ten tooling packages are npm workspaces behind one root lockfile
          # (ADR-049), so setup-node's built-in npm cache is keyed on that single
          # file's hash — with restore-keys fallback — and a commit that changes
          # no dependency now downloads nothing. The workspace blob saved at the
          # end of this job stays keyed on the SHA instead, because it carries
          # build outputs that a lockfile hash says nothing about.
          cache: npm
          cache-dependency-path: package-lock.json

      # tree-sitter build --wasm (invoked by `ci:all` below) downloads a ~119MB
      # wasi-sdk toolchain into ~/.cache/tree-sitter on every invocation unless
      # it's already present. Keyed on the lockfile that pins tree-sitter-cli
      # (which hardcodes the wasi-sdk version it fetches), so a version bump
      # there — and only that — invalidates the cache (sl-wz2h). Restored before
      # the install, since the install is now what triggers the download.
      - name: Cache wasi-sdk toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/tree-sitter
          key: wasi-sdk-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Turborepo's content-hash cache for the build tasks. See the note on the
      # matching step in the `test-stats` job for why the key is namespaced per
      # job rather than shared. This is what makes a commit that changes one
      # package stop rebuilding the other ten.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-install-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-install-${{ runner.os }}-

      # One workspace-aware install, then one ordered build. Both orders used to
      # be spelled out step by step here, in a second copy of what the root
      # package.json already said (feature 42, R2 reduced that to one shell
      # script). `ci:all` is now `npm ci && turbo run build`, and the order is no
      # longer written down at all: Turborepo derives it from the dependency
      # graph in the manifests (R4).
      - name: Install and build all workspace packages
        run: npm run ci:all

      - name: Cache workspace
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            tooling/*/node_modules
            tooling/*/dist
            tooling/satsuma-cli/src/generated
            tooling/tree-sitter-satsuma/build
            tooling/tree-sitter-satsuma/tree-sitter-satsuma.wasm
          key: workspace-${{ github.sha }}

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            tooling/*/node_modules
            tooling/*/dist
            tooling/satsuma-cli/src/generated
            tooling/tree-sitter-satsuma/build
            tooling/tree-sitter-satsuma/tree-sitter-satsuma.wasm
          key: workspace-${{ github.sha }}
          restore-keys: |
            workspace-

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Versions pinned in requirements-dev.txt (Dependabot-managed) so a
      # new ruff release can't change the enforced rules outside a PR (sl-5kvp).
      - name: Install Python lint tools
        run: pip install -r requirements-dev.txt

      # Through turbo, so this job and scripts/run-repo-checks.sh share one entry
      # point into the same task. `lint` is a root task — the five linters are
      # configured once at the root and sweep the whole repo — so this runs the
      # root package.json's `lint` script, not a per-package one.
      - name: Lint
        run: npx turbo run lint

      # Hoisting can satisfy a declared range with the wrong version silently —
      # see the matching step in scripts/run-repo-checks.sh (feature 42, R2).
      - name: Check workspace dependency tree is valid
        run: npm run check:deps

      # Every scripts/*.test.mjs, which since R4 includes the suite asserting the
      # workspace dependency graph Turborepo derives its build order from.
      - name: Test repo tooling scripts
        run: npm run test:scripts

  satsuma-cli:
    name: Satsuma CLI
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling/satsuma-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            tooling/*/node_modules
            tooling/*/dist
            tooling/satsuma-cli/src/generated
            tooling/tree-sitter-satsuma/build
            tooling/tree-sitter-satsuma/tree-sitter-satsuma.wasm
          key: workspace-${{ github.sha }}
          restore-keys: |
            workspace-

      # @satsuma/scenario-gen has no build step and no coverage target, so it gets
      # no shard of its own in the tooling-modules matrix. Its tests run here,
      # where the CLI — its largest consumer — already has everything installed,
      # and *before* the CLI's own suite: a broken generator would otherwise show
      # up as dozens of unexplained property failures.
      - name: Run @satsuma/scenario-gen tests
        working-directory: tooling/satsuma-scenario-gen
        run: npm test

      # Per-job Turborepo cache — see the note in the `test-stats` job for why the
      # key is namespaced rather than shared.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-cli-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-cli-${{ runner.os }}-

      # A named task, so nothing can bypass it the way npm's implicit `pretest`
      # hook was bypassed by any command that was not literally `npm test`
      # (sl-851u).
      - name: Typecheck the CLI test sources
        working-directory: ${{ github.workspace }}
        run: npx turbo run test:typecheck --filter=satsuma-cli

      # A Turborepo task rather than the c8 invocation this step used to spell out
      # inline: a raw command cannot be cached, and this job was the pipeline's
      # second-longest at 135s, almost always re-running a suite whose inputs had
      # not changed. Its declared outputs are the coverage report and the JUnit
      # XML, both now inside the package, so a cache hit restores everything the
      # upload steps below look for. --filter builds its dependencies first.
      - name: Run CLI tests with coverage
        working-directory: ${{ github.workspace }}
        run: npx turbo run test:coverage --filter=satsuma-cli

      - name: Post coverage summary
        if: always()
        run: |
          echo '## Satsuma CLI Coverage' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx c8 report --reporter=text 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check example corpus formatting
        run: |
          find ../../examples -name '*.stm' -print0 | xargs -0 -n1 node dist/index.js fmt --check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-cli
          path: tooling/satsuma-cli/test-results/cli.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-cli
          path: |
            tooling/satsuma-cli/coverage/lcov.info
            tooling/satsuma-cli/coverage/coverage-summary.json

  integration-tests:
    name: Cross-consumer integration tests
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling/integration-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            tooling/*/node_modules
            tooling/*/dist
            tooling/satsuma-cli/src/generated
            tooling/tree-sitter-satsuma/build
            tooling/tree-sitter-satsuma/tree-sitter-satsuma.wasm
          key: workspace-${{ github.sha }}
          restore-keys: |
            workspace-

      # This package's `pretest` was `tsc --noEmit`, and R4 deleted it along with
      # every other pretest hook. Its test:typecheck script survives but no CI job
      # named it — this package has no shard in the tooling-modules matrix — so
      # the typecheck would have silently stopped gating. The local hook covers it
      # via `turbo run test test:typecheck`; this is CI's half.
      - name: Typecheck the parity sweeps
        run: npm run test:typecheck

      - name: Run cross-consumer parity sweeps
        run: npm test

  parser:
    name: Tree-sitter parser
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling/tree-sitter-satsuma
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            tooling/*/node_modules
            tooling/*/dist
            tooling/satsuma-cli/src/generated
            tooling/tree-sitter-satsuma/build
            tooling/tree-sitter-satsuma/tree-sitter-satsuma.wasm
          key: workspace-${{ github.sha }}
          restore-keys: |
            workspace-

      - name: Check generated CST contract is up to date
        run: npm run check:cst-symbols

      - name: Test CST contract generator
        run: npm run test:generator

      - name: Generate parser and CST contract
        run: npm run generate

      - name: Check generated sources are up to date
        run: |
          if ! git diff --exit-code src/; then
            echo "::error::Generated parser sources are out of date. Run 'npm run generate' in tooling/tree-sitter-satsuma/ and commit the result."
            exit 1
          fi

      - name: Check grammar conflicts are documented
        run: |
          count=$(sed -n '/conflicts:.*=>/,/^  \]/p' grammar.js | grep -c '^\s*\[\$\.' || true)
          expected=$(grep -v '^\s*;' CONFLICTS.expected | grep -v '^\s*$' | head -1)
          echo "Grammar conflicts: $count (expected: $expected)"
          if [ "$count" != "$expected" ]; then
            echo "::error::Grammar conflict count changed: expected $expected, got $count"
            echo "If intentional, update CONFLICTS.expected to $count and document the change."
            exit 1
          fi

      - name: Run corpus tests
        # `test:corpus` is `tree-sitter test --wasm`, which is the repo-wide
        # convention (AGENTS.md): there is no native build here, so the corpus
        # must be exercised through the same WASM parser every consumer loads
        # (sl-cysb). Invoked as an npm script rather than by path, so it finds
        # tree-sitter-cli wherever npm workspaces hoisted it.
        run: npm run test:corpus

      - name: Install pytest
        run: pip install pytest

      - name: Run Python tests (fixtures, CST, smoke)
        run: python3 -m pytest scripts/ --junitxml=../../test-results/parser.xml -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-parser
          path: test-results/parser.xml

  test-stats:
    name: Test stats freshness
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            tooling/*/node_modules
            tooling/*/dist
            tooling/satsuma-cli/src/generated
            tooling/tree-sitter-satsuma/build
            tooling/tree-sitter-satsuma/tree-sitter-satsuma.wasm
          key: workspace-${{ github.sha }}
          restore-keys: |
            workspace-

      # See the matching step in the `install` job. Needed here because the
      # `turbo run test` below builds the grammar WASM as a dependency.
      - name: Cache wasi-sdk toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/tree-sitter
          key: wasi-sdk-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Turborepo's content-hash cache, namespaced to this job. A local cache is
      # not shared between jobs (no remote cache — ADR-049), so a single repo-wide
      # key would have every job racing to save and overwriting the others'
      # entries. Per-job keys let this job accumulate exactly the task entries it
      # runs and hit them on the next push; the restore-keys prefix is what
      # carries them across commits.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-test-stats-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-test-stats-${{ runner.os }}-

      # This job was the pipeline's longest at 150s, and all of it was
      # re-execution: it spawned every tracked package's suite from scratch purely
      # to count tests. Turborepo already captures each `test` task's output at
      # tooling/<package>/.turbo/turbo-test.log and replays it on a cache hit, and
      # the generator reads those logs directly — so on a commit that changes one
      # package, only that package's suite actually runs and the rest are replayed.
      #
      # @satsuma/viz-harness is excluded for the same reason `test:all` excludes
      # it: its `test` is Playwright. tree-sitter-satsuma is *not* excluded here,
      # unlike in `test:all`, because its corpus summary is where parserCorpusTests
      # comes from and nothing else in this job would produce it.
      - name: Build and test the workspace
        run: |
          npx turbo run build compile
          npx turbo run test --filter='!@satsuma/viz-harness'

      - name: Regenerate test-stats.json
        run: node scripts/generate-test-stats.mjs --from-logs

      - name: Check test-stats.json is up to date
        run: |
          if ! git diff --exit-code test-stats.json; then
            echo "::error::test-stats.json is out of date. Run 'node scripts/generate-test-stats.mjs' and commit the result."
            echo "If this keeps happening, check 'git config core.hooksPath' prints '.githooks'."
            exit 1
          fi

  vscode-extension:
    name: VS Code extension
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling/vscode-satsuma
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            tooling/*/node_modules
            tooling/*/dist
            tooling/satsuma-cli/src/generated
            tooling/tree-sitter-satsuma/build
            tooling/tree-sitter-satsuma/tree-sitter-satsuma.wasm
          key: workspace-${{ github.sha }}
          restore-keys: |
            workspace-

      - name: Validate manifest and grammar
        run: npm run validate

      - name: Run fixture and golden tests
        run: npm test

      # See the matching step in the `install` job — same rationale for
      # caching the wasi-sdk toolchain instead of re-downloading it here.
      - name: Cache wasi-sdk toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/tree-sitter
          key: wasi-sdk-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Per-job Turborepo cache — see the note in the `test-stats` job. This job
      # builds seven packages through the filter below, so an unchanged
      # dependency chain is a cache hit rather than a rebuild.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-vscode-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-vscode-${{ runner.os }}-

      # Four separate steps until R4 — build the grammar WASM, build the
      # extension, build satsuma-cli "(needed by LSP formatting provider)",
      # then `npx tsc` in the LSP — which between them were this job's own
      # hand-written copy of the cross-package build order, maintained
      # independently of the two other copies. Turborepo derives all of it from
      # the manifests: `--filter` on these two packages pulls in satsuma-core,
      # the VizModel contract, the viz-backend, the viz bundle, the grammar WASM
      # and satsuma-cli, each in the right order, and skips any whose inputs are
      # unchanged. `compile` is the LSP's tsc output, which its test suite's
      # `require("../dist/…")` calls resolve against.
      - name: Build the extension and compile the language server
        run: npx turbo run build compile --filter=vscode-satsuma --filter=@satsuma/lsp

      # The c8 invocation below runs node --test directly, so npm's script hooks
      # never fire. Run the typecheck explicitly so the CST-symbol compile-time
      # regression (sl-851u) actually gates this job.
      - name: Run LSP test:typecheck
        working-directory: tooling/satsuma-lsp
        run: npm run test:typecheck

      - name: Run LSP server tests with coverage
        working-directory: tooling/satsuma-lsp
        run: |
          mkdir -p ../../test-results
          npx c8 --reporter=text --reporter=lcov --reporter=json-summary \
            --include='dist/**/*.js' --exclude='dist/**/*.d.ts' \
            node --test \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=junit --test-reporter-destination=../../test-results/lsp.xml \
              test/**/*.test.js

      - name: Post LSP coverage to step summary
        if: always()
        working-directory: tooling/satsuma-lsp
        run: |
          echo '## Satsuma LSP Coverage' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx c8 report --reporter=text 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-vscode
          path: test-results/lsp.xml

      - name: Upload LSP coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lsp
          path: |
            tooling/satsuma-lsp/coverage/lcov.info
            tooling/satsuma-lsp/coverage/coverage-summary.json

  cli-pack-smoke-test:
    name: CLI pack smoke-test
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling/satsuma-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            tooling/*/node_modules
            tooling/*/dist
            tooling/satsuma-cli/src/generated
            tooling/tree-sitter-satsuma/build
            tooling/tree-sitter-satsuma/tree-sitter-satsuma.wasm
          key: workspace-${{ github.sha }}
          restore-keys: |
            workspace-

      - name: Pack tarball
        run: npm run pack

      - name: Smoke-test global install
        shell: bash
        run: |
          npm install -g ./satsuma-cli.tgz
          satsuma --version

  smoke-tests:
    name: Smoke tests (BDD)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            tooling/*/node_modules
            tooling/*/dist
            tooling/satsuma-cli/src/generated
            tooling/tree-sitter-satsuma/build
            tooling/tree-sitter-satsuma/tree-sitter-satsuma.wasm
          key: workspace-${{ github.sha }}
          restore-keys: |
            workspace-

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r smoke-tests/requirements.txt

      - name: Install satsuma globally
        working-directory: tooling/satsuma-cli
        run: |
          npm run pack
          npm install -g ./satsuma-cli.tgz

      - name: Run smoke tests
        run: |
          mkdir -p test-results
          python3 -m pytest smoke-tests/ -v --tb=short \
            --junit-xml=test-results/smoke-tests.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-smoke-tests
          path: test-results/smoke-tests.xml

  excel-skill:
    name: Excel-to-Satsuma skill
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/excel-to-satsuma/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest openpyxl

      - name: Run skill tests
        run: python3 -m pytest test_excel_tool.py --junitxml=../../../test-results/excel-skill.xml -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-excel-skill
          path: test-results/excel-skill.xml

  # The Satsuma-to-Excel skill shells out to the satsuma CLI, so unlike
  # excel-skill this job needs the built workspace and a global CLI install
  # (same pattern as smoke-tests). Its integration tests run against the
  # canonical example corpus, so this job also guards against corpus
  # restructuring silently breaking the skill (see rc-71wu).
  stm-to-excel-skill:
    name: Satsuma-to-Excel skill
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            tooling/*/node_modules
            tooling/*/dist
            tooling/satsuma-cli/src/generated
            tooling/tree-sitter-satsuma/build
            tooling/tree-sitter-satsuma/tree-sitter-satsuma.wasm
          key: workspace-${{ github.sha }}
          restore-keys: |
            workspace-

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pytest -r skills/satsuma-to-excel/scripts/requirements.txt

      - name: Install satsuma globally
        working-directory: tooling/satsuma-cli
        run: |
          npm run pack
          npm install -g ./satsuma-cli.tgz

      - name: Run skill tests
        run: |
          mkdir -p test-results
          python3 -m pytest skills/satsuma-to-excel/scripts/test_stm_to_excel.py -v \
            --junitxml=test-results/stm-to-excel-skill.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-stm-to-excel-skill
          path: test-results/stm-to-excel-skill.xml

  tooling-modules:
    # Run each module's test:coverage in its own matrix shard so failures are
    # reported against the responsible module and the four shards run in
    # parallel. Each shard uploads coverage-${{ matrix.module }} for the
    # coverage-report job to consume.
    name: ${{ matrix.display }} tests
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: satsuma-core
            display: Satsuma Core
          - module: satsuma-viz-model
            display: Satsuma Viz-Model
          - module: satsuma-viz-backend
            display: Satsuma Viz-Backend
          - module: satsuma-viz
            display: Satsuma Viz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            tooling/*/node_modules
            tooling/*/dist
            tooling/satsuma-cli/src/generated
            tooling/tree-sitter-satsuma/build
            tooling/tree-sitter-satsuma/tree-sitter-satsuma.wasm
          key: workspace-${{ github.sha }}
          restore-keys: |
            workspace-

      # test:coverage runs c8 directly and so fires no npm script hook, which is
      # why the typecheck needs its own step — without it the CST-symbol
      # compile-time regression (sl-851u) would silently not gate CI. `--if-present`
      # rather than an `if:` naming the shards that define the script: R4 gave
      # satsuma-viz a test:typecheck of its own (it was previously buried in that
      # package's `pretest`), and the hardcoded list would have quietly skipped it.
      - name: Run test:typecheck
        working-directory: tooling/${{ matrix.module }}
        run: npm run test:typecheck --if-present

      - name: Run test:coverage
        working-directory: tooling/${{ matrix.module }}
        run: npm run test:coverage

      - name: Post coverage to step summary
        if: always()
        working-directory: tooling/${{ matrix.module }}
        run: |
          echo '## ${{ matrix.display }} Coverage' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx c8 report --reporter=text 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.module }}
          path: |
            tooling/${{ matrix.module }}/coverage/lcov.info
            tooling/${{ matrix.module }}/coverage/coverage-summary.json

  coverage-report:
    # One shard per module, in parallel. davelosert/vitest-coverage-report-action
    # keys sticky PR comments by `name`, so distinct names produce one
    # update-in-place comment per module on each PR run.
    name: Coverage report (${{ matrix.display }})
    if: always() && github.event_name == 'pull_request'
    needs: [satsuma-cli, tooling-modules, vscode-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: coverage-cli
            display: Satsuma CLI
          - artifact: coverage-satsuma-core
            display: Satsuma Core
          - artifact: coverage-satsuma-viz-model
            display: Satsuma Viz-Model
          - artifact: coverage-satsuma-viz-backend
            display: Satsuma Viz-Backend
          - artifact: coverage-satsuma-viz
            display: Satsuma Viz
          - artifact: coverage-lsp
            display: Satsuma LSP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: coverage

      - name: Post ${{ matrix.display }} coverage
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        with:
          name: ${{ matrix.display }} Coverage
          json-summary-path: coverage/coverage-summary.json
          json-final-path: ""

  test-report:
    name: Test report
    if: always()
    needs: [satsuma-cli, parser, vscode-extension, excel-skill, stm-to-excel-skill, cli-pack-smoke-test, smoke-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: test-results-*
          merge-multiple: true
          path: test-results

      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Test Results
          path: test-results/*.xml
          reporter: java-junit
          fail-on-empty: false

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # gitleaks-action v3 requires an org-tier licence
      # (https://gitleaks.io/products) for org-owned repositories. Until the
      # EqualExperts org has obtained a key and stored it as the
      # GITLEAKS_LICENSE secret, this step skips itself rather than failing
      # the build. The step re-enables automatically once the secret is set
      # — no further code change required.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        if: ${{ env.GITLEAKS_LICENSE != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
